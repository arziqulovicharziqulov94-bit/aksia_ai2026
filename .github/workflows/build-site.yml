name: Saytni qurish va joylash

# Har ish kuni AQSh bozori yopilgandan keyin sayt qayta quriladi va GitHub Pages'ga joylanadi.
# Qo'lda ishga tushirish: Actions -> "Saytni qurish va joylash" -> Run workflow (xohlasangiz to'liq tahlil uchun tikerlarni yozing).
# Birinchi ishga tushirish uzoq davom etishi mumkin (barcha NYSE/NASDAQ aksiyalari yuklanadi); keyingilari kesh tufayli tezroq.
on:
  schedule:
    - cron: "30 22 * * 1-5"        # 22:30 UTC (Toshkent: ertasi kuni 03:30), dushanba-juma
  workflow_dispatch:
    inputs:
      tickers:
        description: "To'liq tahlil (AI, fundamental, yangilik) uchun qo'shimcha tikerlar (vergul bilan), masalan: PLTR, SOFI — doimiy saqlanadi"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "extra_tickers.txt"
      - "app.py"
      - "build_site.py"
      - "requirements.txt"
      - ".github/workflows/build-site.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write              # extra_tickers.txt ni saqlash va jadval o'chib qolmasligi uchun (pastga qarang)
    env:
      PYTHONUNBUFFERED: "1"
      AKSIYA_CACHE: ${{ github.workspace }}/.aksiya_cache   # narx tarixi va tikerlar ro'yxati keshi (keyingi ishlar tezroq va barqarorroq)
      AKSIYA_JOB_MINUTES: "200"                             # build_site.py umumiy vaqt chegarasi (timeout-minutes dan kichik bo'lsin)
      AKSIYA_FALLBACK_SECONDS: "900"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Keshni tiklash
        uses: actions/cache/restore@v4
        with:
          path: .aksiya_cache
          key: aksiya-kesh-${{ github.run_id }}
          restore-keys: |
            aksiya-kesh-

      - name: Ma'lumot manbalarini tekshirish
        run: |
          mkdir -p .aksiya_cache
          python app.py --check-data

      - name: Yangi tikerlarni saqlash
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tickers != '' }}
        env:
          NEW_TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          python build_site.py --save-extras "$NEW_TICKERS"
          if ! git diff --quiet -- extra_tickers.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add extra_tickers.txt
            git commit -m "Qo'shimcha tikerlar qo'shildi"
            git push
          fi

      - name: Saytni qurish
        run: python build_site.py --out site

      - name: Keshni saqlash
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .aksiya_cache
          key: aksiya-kesh-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Jadval o'chib qolmasligi uchun (GitHub 60 kun faolsiz repozitoriyda jadvalli ishlarni o'chiradi)
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 40 ]; then
            date -u +"%Y-%m-%d" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Jadval faol qolishi uchun belgi"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
